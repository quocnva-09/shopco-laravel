services:
  web:
    image: nginx:alpine
    container_name: shopco_nginx
    restart: always
    deploy:
      resources:
        limits:
          memory: 50M
    ports:
      - "80:80"
    volumes:
      # Get code from shared volume
      - shared_app_code:/var/www/html 
      # Mount config file nginx
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - shopco-network

  app:
    image: anhquoc09/shopco-laravel:latest
    container_name: shopco_app
    restart: always
    deploy:
      resources:
        limits:
          memory: 300M
    env_file: .env
    volumes:
      - shared_app_code:/var/www/html 
      - storage_data:/var/www/html/storage
    depends_on:
      - shopco_db
      - redis_data
    networks:
      - shopco-network

  worker:
    image: anhquoc09/shopco-laravel:latest
    container_name: shopco_worker
    restart: always
    deploy:
      resources:
        limits:
          memory: 150M
    # Overwrite command to active supervisor
    command: ["/usr/bin/supervisord", "-n", "-c", "/etc/supervisor/conf.d/supervisord.conf"]
    env_file: .env
    volumes:
      - shared_app_code:/var/www/html
      - storage_data:/var/www/html/storage
    depends_on:
      - shopco_db
      - redis_data
    networks:
      - shopco-network

  shopco_db:
    image: mysql:8.0.45-debian
    container_name: shopco_db
    restart: always
    deploy:
      resources:
        limits:
          memory: 250M
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD}"
      MYSQL_DATABASE: "${DB_DATABASE}"
    command:
      - --default-authentication-plugin=mysql_native_password
      - --skip-name-resolve
      - --performance-schema=OFF
      - --innodb-buffer-pool-size=64M
    volumes:
      - shopco-db-data:/var/lib/mysql
    networks:
      - shopco-network

  redis_data:
    image: redis:7-alpine
    container_name: shopco_redis
    restart: always
    deploy:
      resources:
        limits:
          memory: 100M
    command: redis-server --requirepass "${REDIS_PASSWORD}" --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - shopco-network

volumes:
  shopco-db-data:
  storage_data:
  redis_data:
  shared_app_code: 

networks:
  shopco-network: