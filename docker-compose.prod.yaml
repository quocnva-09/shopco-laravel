services:
  app:
    image: anhquoc09/shopco-laravel:latest
    container_name: shopco_app
    restart: always
    env_file: .env
    ports:
      - "80:80"
    volumes:
      - storage_data:/var/www/html/storage
    depends_on:
      - shopco_db
    networks:
      - shopco-network

  worker:
    image: anhquoc09/shopco-laravel:latest
    container_name: shopco_worker
    command: php artisan queue:work
    user: "www-data"
    env_file: .env
    volumes:
      - storage_data:/var/www/html/storage
    depends_on:
      - shopco_db
    networks:
      - shopco-network

  shopco_db:
    image: mysql:8.0.45-debian
    container_name: shopco_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD}"
      MYSQL_DATABASE: "${DB_DATABASE}"
    command:
      - --default-authentication-plugin=mysql_native_password
      - --skip-name-resolve
      - --performance-schema=OFF
      - --innodb-buffer-pool-size=64M
    volumes:
      - shopco-db-data:/var/lib/mysql
    networks:
      - shopco-network

  redis_data:
    image: redis:7-alpine
    container_name: shopco_redis
    restart: always
    command: redis-server --requirepass "${REDIS_PASSWORD}" --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - shopco-network

volumes:
  shopco-db-data:
  storage_data:
  redis_data:

networks:
  shopco-network: