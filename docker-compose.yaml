version: "3.8"

services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shopco_app
    restart: always
    ports:
      - "8000:80"   
    volumes:
      - .:/var/www/html
      - storage_data:/var/www/html/storage
    depends_on:
      - shopco_db
    networks:
      - shopco-network
  
  worker:
    build: .
    container_name: shopco_worker
    command: php artisan queue:work
    user: "www-data"
    volumes:
      - .:/var/www/html
      - storage_data:/var/www/html/storage

  shopco_db:
    image: mysql:8.0.45-debian
    container_name: shopco_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
      MYSQL_DATABASE: '${DB_DATABASE}'
    command: --skip-name-resolve
    ports:
      - "3307:3306" 
    volumes:
      - shopco-db-data:/var/lib/mysql
    networks:
      - shopco-network


  shopco-phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: shopco-phpmyadmin
    restart: always
    ports:
      - "8081:80"
    environment:
      PMA_HOST: '${DB_HOST}'
      PMA_PORT: '${DB_PORT}'
      MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
    depends_on:
      - shopco_db
    networks:
      - shopco-network

  redis_data:
    image: redis:7-alpine
    container_name: shopco_redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - shopco-network

volumes:
  shopco-db-data:
  storage_data:
  redis_data:

networks:
  shopco-network: