name: Deploy Laravel to EC2

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/shopco-laravel:latest

  deploy-to-ec2:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      # Action 1: Transfer docker-compose.prod.yaml and nginx configs to EC2
      - name: Copy compose file and nginx configs to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.prod.yaml, docker/nginx/default.conf"
          target: "/home/ubuntu/shopco-laravel"

      # Action 2: SSH into EC2, write .env, pull new image, and run
      - name: Execute deployment on EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/shopco-laravel

            # Step 1: Write production .env from GitHub Secret (prevents committing secrets)
            echo "${{ secrets.ENV_PRODUCTION }}" > .env

            # Step 2: Pull new image from Docker Hub
            docker compose -f docker-compose.prod.yaml pull

            # Step 3: Restart containers with new image
            docker compose -f docker-compose.prod.yaml up -d --wait

            # Step 4: Run database migrations
            docker compose -f docker-compose.prod.yaml exec -T app php artisan migrate --force

            # Step 5: Run database seeders
            docker compose -f docker-compose.prod.yaml exec -T app php artisan db:seed

            # Step 5: Clear and rebuild cache to optimize performance
            docker compose -f docker-compose.prod.yaml exec -T app php artisan optimize:clear

            # Step 6: Optimize database for production
            docker compose -f docker-compose.prod.yaml exec -T app php artisan optimize

            echo "Deployment complete."
