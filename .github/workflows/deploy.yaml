name: Deploy Laravel to EC2

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/shopco-laravel:latest

  deploy-to-ec2:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # Action 1: Transfer docker-compose.prod.yaml from GitHub to EC2
      - name: Copy compose file to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.prod.yaml"
          target: "/home/ubuntu/shopco-laravel"

      # Action 2: SSH into EC2, write .env, pull new image, and run
      - name: Execute deployment on EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/shopco-laravel

            # Step 1: Write production .env from GitHub Secret (prevents committing secrets)
            echo "${{ secrets.ENV_PRODUCTION }}" > .env

            # Step 2: Pull new image from Docker Hub
            docker compose -f docker-compose.prod.yaml pull

            # Step 3: Restart containers with new image
            docker compose -f docker-compose.prod.yaml up -d

            # Step 4: Wait for DB to be ready before running migrations
            echo "Waiting for database to be ready..."
            sleep 45

            # Step 5: Run database migrations
            docker compose -f docker-compose.prod.yaml exec -T app php artisan migrate --force

            # Step 6: Clear any stale cached config from the previous image/deploy,
            #         then rebuild the cache from the freshly written .env.
            #         This MUST happen before swagger generation so that
            #         APP_URL and L5_SWAGGER_CONST_HOST resolve to the HTTPS values.
            docker compose -f docker-compose.prod.yaml exec -T app php artisan config:clear
            docker compose -f docker-compose.prod.yaml exec -T app php artisan config:cache

            # Step 7: Regenerate swagger JSON with the correct HTTPS host now in cache.
            #         The generated api-docs.json will contain url: https://api.quocnva09.me,
            #         which allows Swagger UI to fetch the spec without CORS/Mixed-Content errors.
            docker compose -f docker-compose.prod.yaml exec -T app php artisan l5-swagger:generate

            echo "Deployment complete."
